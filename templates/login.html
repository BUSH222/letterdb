{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block banner %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-3">
  <h1 class="h2">Вход</h1>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
    <div class="mb-3"><label class="form-label" for="password">Пароль</label><input type="password" class="form-control" id="password" name="password" required></div>
    <button type="submit" class="btn btn-gold">Войти</button>
  </form>
</div>
{% endblock %}
