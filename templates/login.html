<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Вход</title>
</head>

<body>
	<h1>Вход</h1>
	{% if error %}<p style="color: #b00020;">{{ error }}</p>{% endif %}
	<form method="POST" action="/login">
		<p><label>Email<br><input type="email" name="email" required autofocus></label></p>
		<p><label>Пароль<br><input type="password" name="password" required></label></p>
		<button type="submit">Войти</button>
	</form>
</body>

</html>
