{% extends "base.html" %}
{% block title %}Новое письмо{% endblock %}
{% block banner_title %}Новое письмо{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="container letter-form py-4">
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form action="/finalise_new_letter" method="post">
    {% include "_letter_fields.html" %}
    <button type="submit" class="btn btn-gold mt-5">Создать письмо</button>
  </form>
</div>
{% endblock %}

{% block scripts %}<script src="/static/tag_input.js"></script>{% endblock %}
