[project]
name = "letterdb"
version = "0.1.0"
description = "Web application for the interactive storage of letters of Vladimir Obruchev"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "Jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "starlette>=1.10.0",  # imported directly; also keeps the fixed releases (1.3.1+) as the floor
    "uvicorn>=0.54.0",
    "Werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.93",
]


[tool.ruff]
target-version = "py314"
line-length = 119
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "TCH", # flake8-type-checking
]
ignore = [
    "RUF001",  # Cyrillic strings are intentional in this project
    "RUF002",  # ...and in docstrings
    "RUF003",  # ...and in comments
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
all = "warn"

# `x: Mapped[T] = mapped_column(...)` is the standard SQLAlchemy declaration
[[tool.ty.overrides]]
include = ["letterdb/models.py"]
[tool.ty.overrides.rules]
unsound-assignment = "ignore"

